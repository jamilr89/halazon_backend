services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - medusa_network

  # Medusa Server
  # This service runs the Medusa backend application
  # and the admin dashboard.
  medusa:
    build: .
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "9000:9000"
      - "7001:7001"
      - "5173:5173"
    environment:
    - NODE_PATH=/server/apps/backend/node_modules
    - NODE_ENV=development
    - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?max=5&idle_timeout=30
    - REDIS_URL=redis://redis:6379
    env_file:
      - apps/backend/.env
    volumes:
    - ./apps/backend:/server/apps/backend  # only sync backend source
    - /server/apps/backend/node_modules    # preserve container's node_modules
    networks:
      - medusa_network

  # Storefront
  # This service runs the Next.js Starter Storefront
  # docker ps | grep storefront

volumes:
  postgres_data:

networks:
  medusa_network:
    driver: bridge







